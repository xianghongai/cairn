# 自包含的测试环境。仓库以只读方式挂载到 /workspace。
#
#   docker compose -f test/compose.yaml run --rm test
name: cairn-test

services:
  # Bash 与 Zsh，GNU coreutils。两种 Shell 都跑全量测试。
  # JSONC 合并：node + jsonc-parser（装在 /opt/cairn-js，经 NODE_PATH 找到）。
  # YAML 合并：mikefarah yq（固定版本的官方二进制；Ubuntu 的 yq 包是另一个实现）。
  test:
    build:
      context: .
      dockerfile_inline: |
        FROM ubuntu:24.04
        ENV DEBIAN_FRONTEND=noninteractive LANG=C.UTF-8 LC_ALL=C.UTF-8
        RUN apt-get update && apt-get install -y --no-install-recommends \
              bash zsh jq shellcheck python3 python3-tomlkit curl wget ca-certificates nodejs npm \
            && rm -rf /var/lib/apt/lists/* \
            && npm install --prefix /opt/cairn-js --no-audit --no-fund jsonc-parser@3.3.1 \
            && curl -fsSL -o /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.54.1/yq_linux_amd64 \
            && chmod 755 /usr/local/bin/yq
        ENV NODE_PATH=/opt/cairn-js/node_modules
        WORKDIR /workspace
    image: cairn-test:latest
    volumes:
      - type: bind
        source: ..
        target: /workspace
        read_only: true
    working_dir: /workspace
    network_mode: none
    init: true
    restart: 'no'
    command: >
      bash -c '
      bash -n cairn.sh && zsh -n cairn.sh &&
      shellcheck --shell=bash --severity=style cairn.sh test/cairn/tests.sh &&
      for sh in bash zsh; do
        TEST_SHELL=$$sh bash test/cairn/tests.sh || exit 1;
      done'
